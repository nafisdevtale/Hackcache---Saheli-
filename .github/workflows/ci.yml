name: Saheli CI Verification Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Check Code Formatting
        run: bun x prettier --check .

      - name: Run ESLint
        run: bun run lint

      - name: Run Vitest Suite (Unit, Clinical Safety & Integration Tests)
        run: bun run test

      - name: Verify Production PWA & SSR Build
        run: bun run build
